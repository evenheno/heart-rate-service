<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebSocket Race</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#242845,#0d0f1b 58%);color:#f6f7ff}.wrap{width:min(96vw,980px)}h1{margin:0 0 6px;font-size:clamp(28px,5vw,48px)}.sub{opacity:.75;margin-bottom:14px}.panel{background:rgba(10,12,24,.76);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;box-shadow:0 22px 70px rgba(0,0,0,.35)}.hud{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pill{padding:8px 12px;border-radius:999px;background:#171a2d;border:1px solid rgba(255,255,255,.08)}#status{font-weight:700}canvas{width:100%;aspect-ratio:900/520;background:#0a0d18;border-radius:14px;display:block}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}button{color:white;background:#292e52;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.legend{opacity:.72;font-size:14px}</style></head>
<body><div class="wrap"><h1>⚡ WebSocket Race</h1><div class="sub">Two players, one glowing target. First to 5 points wins.</div><div class="panel"><div class="hud"><div id="status" class="pill">Connecting…</div><div id="scores" class="pill">Blue 0 — 0 Pink</div></div><canvas id="game" width="900" height="520"></canvas><div class="controls"><div class="legend">Move with <b>WASD</b> or <b>Arrow Keys</b>. Extra visitors spectate.</div><button id="reset">Reset round</button></div></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),s=document.getElementById('status'),sc=document.getElementById('scores'),r=document.getElementById('reset');
let slot=0,state={players:[],target:{x:450,y:260},winner:null}; const proto=location.protocol==='https:'?'wss':'ws'; const ws=new WebSocket(proto+'://'+location.host+'/ws');
ws.onopen=()=>s.textContent='Connected'; ws.onclose=()=>s.textContent='Disconnected';
ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.type==='welcome'){slot=m.slot;s.textContent=slot?'You are Player '+slot:'Spectator mode'} if(m.type==='state'){state=m;const a=state.players.find(p=>p.slot===1)?.score??0,b=state.players.find(p=>p.slot===2)?.score??0;sc.textContent='Blue '+a+' — '+b+' Pink';draw()} if(m.type==='winner')s.textContent='🏆 Player '+m.slot+' wins!'; if(m.type==='round-reset')s.textContent=slot?'You are Player '+slot:'Spectator mode'};
const held=new Set(); addEventListener('keydown',e=>held.add(e.key.toLowerCase())); addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
setInterval(()=>{if(ws.readyState!==1||!slot)return;let dx=0,dy=0;if(held.has('a')||held.has('arrowleft'))dx--;if(held.has('d')||held.has('arrowright'))dx++;if(held.has('w')||held.has('arrowup'))dy--;if(held.has('s')||held.has('arrowdown'))dy++;if(dx||dy)ws.send(JSON.stringify({type:'move',dx,dy}))},33);
r.onclick=()=>ws.readyState===1&&ws.send(JSON.stringify({type:'reset'}));
function draw(){x.fillStyle='#0a1020';x.fillRect(0,0,900,520);x.strokeStyle='rgba(255,255,255,.045)';for(let gx=0;gx<=900;gx+=45){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,520);x.stroke()}for(let gy=0;gy<=520;gy+=40){x.beginPath();x.moveTo(0,gy);x.lineTo(900,gy);x.stroke()}const t=state.target;x.save();x.shadowBlur=30;x.shadowColor='#ffe66d';x.fillStyle='#ffe66d';x.beginPath();x.arc(t.x,t.y,15,0,Math.PI*2);x.fill();x.restore();for(const p of state.players){if(!p.slot)continue;const col=p.slot===1?'#4cc9f0':'#ff5ca8';x.save();x.shadowBlur=22;x.shadowColor=col;x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,22,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.textAlign='center';x.font='bold 14px system-ui';x.fillText('P'+p.slot,p.x,p.y+5);x.restore()}if(state.winner){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,900,520);x.fillStyle='#fff';x.textAlign='center';x.font='800 52px system-ui';x.fillText('Player '+state.winner+' wins!',450,245);x.font='20px system-ui';x.fillText('Press Reset round to play again',450,285)}} draw();
</script></body></html>
